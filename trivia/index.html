<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Validação de Criativos — Trivia | Admotion</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #000;
}

.wrap {
    background: linear-gradient(
        135deg,
        #000 0%,
        #002b1a 40%,
        #004d2b 70%,
        #00693c 100%
    );
    min-height: 100vh;
    padding: 40px 24px 60px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 32px;
}

.brand {
    color: #21dd66;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .04em;
    margin-bottom: 16px;
}

.header h1 {
    font-size: 22px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 6px;
}

.header p {
    font-size: 14px;
    color: rgba(255,255,255,.5);
}


/* STATUS */

.status-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    margin-bottom: 42px;
}

.stat {
    text-align: center;
}

.stat-num {
    font-size: 26px;
    font-weight: 600;
    color: #fff;
    display: block;
    line-height: 1;
}

.stat-num.green {
    color: #21dd66;
}

.stat-num.red {
    color: #ff5c5c;
}

.stat-label {
    font-size: 11px;
    color: rgba(255,255,255,.4);
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-top: 4px;
    display: block;
}

.divider {
    width: 1px;
    height: 40px;
    background: rgba(255,255,255,.1);
}


/* SEÇÕES */

.section {
    max-width: 1180px;
    margin: 0 auto 48px;
}

.section-title {
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,.08);
}


/* GRID */

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    align-items: start;
}


/* CARD */

.card {
    background: rgba(0,0,0,.48);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color .2s;
}

.card.approved {
    border-color: rgba(33,221,102,.5);
}

.card.rejected {
    border-color: rgba(255,92,92,.5);
}


/*
=================================================
ÁREA DO CRIATIVO

A altura agora é determinada pelo próprio banner.
Não existe mais min-height fixa.
=================================================
*/

.preview-area {
    width: 100%;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: rgba(255,255,255,.015);
}

.creative-frame {
    position: relative;
    overflow: hidden;
    flex: 0 0 auto;

    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 4px;
}

.creative-frame iframe {
    position: absolute;
    top: 0;
    left: 0;

    border: 0;
    display: block;

    transform-origin: top left;
}


/* CARD BODY */

.card-body {
    padding: 16px;
    border-top: 1px solid rgba(255,255,255,.06);
}

.title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 9px;
}

.card-name {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,.9);
}

.size-tag {
    font-size: 11px;
    color: #21dd66;
    background: rgba(33,221,102,.1);
    border: 1px solid rgba(33,221,102,.2);
    border-radius: 20px;
    padding: 3px 9px;
    white-space: nowrap;
}


/* STATUS PILL */

.status-pill {
    display: inline-flex;
    align-items: center;
    font-size: 12px;
    border-radius: 20px;
    padding: 4px 10px;
    margin-bottom: 12px;
}

.status-pill.pending {
    background: rgba(255,255,255,.05);
    color: rgba(255,255,255,.4);
    border: 1px solid rgba(255,255,255,.08);
}

.status-pill.approved {
    background: rgba(33,221,102,.1);
    color: #21dd66;
    border: 1px solid rgba(33,221,102,.22);
}

.status-pill.rejected {
    background: rgba(255,92,92,.1);
    color: #ff5c5c;
    border: 1px solid rgba(255,92,92,.22);
}


/* OBSERVAÇÃO */

.obs-box {
    background: rgba(255,92,92,.06);
    border: 1px solid rgba(255,92,92,.18);
    border-radius: 8px;
    padding: 9px 10px;
    margin-bottom: 10px;
    display: none;
}

.obs-box.show {
    display: block;
}

.obs-label {
    font-size: 10px;
    color: rgba(255,92,92,.65);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 4px;
}

.obs-text {
    font-size: 12px;
    color: rgba(255,180,180,.85);
    line-height: 1.5;
}


/* BOTÕES */

.btn-row {
    display: flex;
    gap: 8px;
}

.btn {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: .15s;
}

.btn:active {
    transform: scale(.98);
}

.btn-ok {
    background: rgba(33,221,102,.1);
    color: #21dd66;
    border: 1px solid rgba(33,221,102,.25);
}

.btn-ok:hover {
    background: rgba(33,221,102,.18);
}

.btn-ok.on {
    background: #21dd66;
    color: #000;
    border-color: #21dd66;
}

.btn-fix {
    background: rgba(255,92,92,.08);
    color: #ff5c5c;
    border: 1px solid rgba(255,92,92,.22);
}

.btn-fix:hover {
    background: rgba(255,92,92,.16);
}

.btn-fix.on {
    background: #ff5c5c;
    color: #fff;
    border-color: #ff5c5c;
}


/* FORM AJUSTE */

.reject-form {
    margin-top: 10px;
    display: none;
}

.reject-form.show {
    display: block;
}

.reject-form textarea {
    width: 100%;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,92,92,.28);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 12px;
    color: rgba(255,255,255,.85);
    resize: vertical;
    font-family: inherit;
    margin-bottom: 7px;
    outline: none;
}

.reject-form textarea:focus {
    border-color: rgba(255,92,92,.55);
}

.reject-form textarea::placeholder {
    color: rgba(255,255,255,.22);
}

.btn-confirm {
    width: 100%;
    padding: 9px;
    background: #ff5c5c;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
}


/* RESUMO */

.summary {
    max-width: 1180px;
    margin: 0 auto;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 24px;
}

.sum-title {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,.6);
    margin-bottom: 12px;
}

.sum-body {
    font-size: 12px;
    color: rgba(255,255,255,.5);
    white-space: pre-wrap;
    line-height: 1.8;
    font-family: 'Courier New', monospace;
}

.btn-copy {
    margin-top: 12px;
    padding: 8px 16px;
    background: rgba(33,221,102,.1);
    color: #21dd66;
    border: 1px solid rgba(33,221,102,.22);
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
}


/* RESPONSIVO */

@media (max-width: 800px) {

    .wrap {
        padding: 28px 12px 40px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .preview-area {
        padding: 16px 8px;
    }

}

</style>
</head>


<body>

<div class="wrap">

    <div class="header">

        <div class="brand">ADMOTION</div>

        <h1>
            Validação de Criativos — Trivia
        </h1>

        <p>
            Revise cada peça e aprove ou solicite ajustes abaixo.
        </p>

    </div>


    <div class="status-bar">

        <div class="stat">

            <span
                class="stat-num"
                id="n-total">
                16
            </span>

            <span class="stat-label">
                Total
            </span>

        </div>


        <div class="divider"></div>


        <div class="stat">

            <span
                class="stat-num green"
                id="n-ok">
                0
            </span>

            <span class="stat-label">
                Aprovados
            </span>

        </div>


        <div class="divider"></div>


        <div class="stat">

            <span
                class="stat-num red"
                id="n-fix">
                0
            </span>

            <span class="stat-label">
                Com ajuste
            </span>

        </div>

    </div>


    <div id="sections"></div>


    <div class="summary">

        <div class="sum-title">
            ● Resumo para envio
        </div>

        <div
            class="sum-body"
            id="sum">
        </div>

        <button
            class="btn-copy"
            onclick="copySummary()">

            📋 Copiar resumo

        </button>

    </div>

</div>



<script>

/*
=================================================
CRIATIVOS
=================================================
*/

const creatives = [

    /*
    MULHER — TRILHOS
    */

    {
        group: "Mulher — Trilhos",
        folder: "Trivia_Mulher_300x250_Vrs-Trilhos-300x250-px",
        name: "Mulher — Trilhos",
        w: 300,
        h: 250
    },

    {
        group: "Mulher — Trilhos",
        folder: "Trivia_Mulher_300x600_Vrs-Trilhos-300x600-px",
        name: "Mulher — Trilhos",
        w: 300,
        h: 600
    },

    {
        group: "Mulher — Trilhos",
        folder: "Trivia_Mulher_320x50_Vrs-Trilhos-320x50-px",
        name: "Mulher — Trilhos",
        w: 320,
        h: 50
    },

    {
        group: "Mulher — Trilhos",
        folder: "Trivia_Mulher_728x90_Vrs-Trilhos-728x90-px",
        name: "Mulher — Trilhos",
        w: 728,
        h: 90
    },


    /*
    TREM — INVESTIMENTO
    */

    {
        group: "Trem — Investimento",
        folder: "Trivia_Trem_300x250_Vrs-Investimento-300x250-px",
        name: "Trem — Investimento",
        w: 300,
        h: 250
    },

    {
        group: "Trem — Investimento",
        folder: "Trivia_Trem_300x600_Vrs-Investimento-300x600-px",
        name: "Trem — Investimento",
        w: 300,
        h: 600
    },

    {
        group: "Trem — Investimento",
        folder: "Trivia_Trem_320x50_Vrs-Investimento-320x50-px",
        name: "Trem — Investimento",
        w: 320,
        h: 50
    },

    {
        group: "Trem — Investimento",
        folder: "Trivia_Trem_728x90_Vrs-Investimento-728x90-px",
        name: "Trem — Investimento",
        w: 728,
        h: 90
    },


    /*
    TREM — MODERNIZAÇÃO
    */

    {
        group: "Trem — Modernização",
        folder: "Trivia_Trem_300x250_Vrs-Modernização-300x250-px",
        name: "Trem — Modernização",
        w: 300,
        h: 250
    },

    {
        group: "Trem — Modernização",
        folder: "Trivia_Trem_300x600_Vrs-Modernização-300x600-px",
        name: "Trem — Modernização",
        w: 300,
        h: 600
    },

    {
        group: "Trem — Modernização",
        folder: "Trivia_Trem_320x50_Vrs-Modernização-320x50-px",
        name: "Trem — Modernização",
        w: 320,
        h: 50
    },

    {
        group: "Trem — Modernização",
        folder: "Trivia_Trem_728x90_Vrs-Modernização-728x90-px",
        name: "Trem — Modernização",
        w: 728,
        h: 90
    },


    /*
    TREM — TRILHOS
    */

    {
        group: "Trem — Trilhos",
        folder: "Trivia_Trem_300x250_Vrs-Trilhos-300x250-px",
        name: "Trem — Trilhos",
        w: 300,
        h: 250
    },

    {
        group: "Trem — Trilhos",
        folder: "Trivia_Trem_300x600_Vrs-Trilhos-300x600-px",
        name: "Trem — Trilhos",
        w: 300,
        h: 600
    },

    {
        group: "Trem — Trilhos",
        folder: "Trivia_Trem_320x50_Vrs-Trilhos-320x50-px",
        name: "Trem — Trilhos",
        w: 320,
        h: 50
    },

    {
        group: "Trem — Trilhos",
        folder: "Trivia_Trem_728x90_Vrs-Trilhos-728x90-px",
        name: "Trem — Trilhos",
        w: 728,
        h: 90
    }

];



/*
=================================================
STATUS
=================================================
*/

const st = creatives.map(() => ({
    s: "pending",
    obs: ""
}));



function stats() {

    document.getElementById("n-ok").textContent =
        st.filter(x => x.s === "approved").length;

    document.getElementById("n-fix").textContent =
        st.filter(x => x.s === "rejected").length;

}



function summary() {

    const lines = [

        "📋 VALIDAÇÃO DE CRIATIVOS — TRIVIA",
        ""

    ];


    creatives.forEach((c, i) => {

        const icon =
            st[i].s === "approved"
                ? "✅"
                : st[i].s === "rejected"
                ? "❌"
                : "⏳";


        lines.push(
            `${icon} ${c.name} — ${c.w}×${c.h}`
        );


        if (
            st[i].s === "rejected" &&
            st[i].obs
        ) {

            lines.push(
                "   → Ajuste: " + st[i].obs
            );

        }

    });


    lines.push("");


    lines.push(

        `Total: ${creatives.length}` +

        ` | ✅ ${
            st.filter(x => x.s === "approved").length
        } aprovados` +

        ` | ❌ ${
            st.filter(x => x.s === "rejected").length
        } com ajuste` +

        ` | ⏳ ${
            st.filter(x => x.s === "pending").length
        } pendentes`

    );


    document.getElementById("sum").textContent =
        lines.join("\n");

}



function render(i) {

    const card =
        document.getElementById("c" + i);

    const s = st[i];


    card.className =
        "card" +
        (
            s.s !== "pending"
                ? " " + s.s
                : ""
        );


    const pill =
        card.querySelector(".status-pill");


    pill.className =
        "status-pill " + s.s;


    pill.textContent =

        s.s === "pending"

            ? "⏳ Aguardando revisão"

            : s.s === "approved"

            ? "✅ Aprovado"

            : "❌ Ajuste solicitado";


    card
        .querySelector(".btn-ok")
        .classList
        .toggle(
            "on",
            s.s === "approved"
        );


    card
        .querySelector(".btn-fix")
        .classList
        .toggle(
            "on",
            s.s === "rejected"
        );


    const obs =
        card.querySelector(".obs-box");


    if (
        s.s === "rejected" &&
        s.obs
    ) {

        obs.classList.add("show");

        obs.querySelector(".obs-text")
            .textContent = s.obs;

    } else {

        obs.classList.remove("show");

    }


    if (
        s.s !== "rejected"
    ) {

        card
            .querySelector(".reject-form")
            .classList
            .remove("show");

        card
            .querySelector("textarea")
            .value = "";

    }

}



function approve(i) {

    st[i] = {
        s: "approved",
        obs: ""
    };

    render(i);
    stats();
    summary();

}



function toggleFix(i) {

    const form =
        document.getElementById(
            "rf" + i
        );


    form
        .classList
        .toggle("show");


    if (
        form.classList.contains("show")
    ) {

        form
            .querySelector("textarea")
            .focus();

    }

}



function confirmFix(i) {

    const obs =

        document
            .getElementById("rf" + i)
            .querySelector("textarea")
            .value
            .trim();


    st[i] = {

        s: "rejected",
        obs: obs

    };


    render(i);
    stats();
    summary();

}



function copySummary() {

    navigator.clipboard
        .writeText(
            document.getElementById("sum")
                .textContent
        )
        .then(() => {

            const button =
                document.querySelector(
                    ".btn-copy"
                );


            button.textContent =
                "✅ Copiado!";


            setTimeout(() => {

                button.textContent =
                    "📋 Copiar resumo";

            }, 2000);

        });

}



/*
=================================================
ESCALA DOS BANNERS

300x250 = 100%
320x50  = 100%
300x600 = 75%
728x90  = reduzido para 520px de largura

O espaço externo acompanha exatamente
o tamanho visual resultante.
=================================================
*/

function getScale(c) {

    if (
        c.w === 300 &&
        c.h === 600
    ) {
        return 0.75;
    }


    if (
        c.w === 728 &&
        c.h === 90
    ) {
        return 520 / 728;
    }


    return 1;

}



/*
=================================================
MONTA A PÁGINA
=================================================
*/

const groups = [
    ...new Set(
        creatives.map(c => c.group)
    )
];


const root =
    document.getElementById(
        "sections"
    );



groups.forEach(group => {

    const section =
        document.createElement(
            "section"
        );


    section.className =
        "section";


    section.innerHTML = `

        <h2 class="section-title">
            ${group}
        </h2>

        <div class="grid"></div>

    `;


    const grid =
        section.querySelector(
            ".grid"
        );


    creatives.forEach((c, i) => {

        if (
            c.group !== group
        ) {
            return;
        }


        const scale =
            getScale(c);


        const displayWidth =
            Math.round(
                c.w * scale
            );


        const displayHeight =
            Math.round(
                c.h * scale
            );


        grid.innerHTML += `

        <div
            class="card"
            id="c${i}"
        >

            <div class="preview-area">

                <div
                    class="creative-frame"

                    style="
                        width:${displayWidth}px;
                        height:${displayHeight}px;
                    "
                >

                    <iframe

                        src="./${c.folder}/index.html"

                        title="${c.name}"

                        loading="lazy"

                        scrolling="no"

                        style="
                            width:${c.w}px;
                            height:${c.h}px;
                            transform:scale(${scale});
                        "
                    >

                    </iframe>

                </div>

            </div>


            <div class="card-body">

                <div class="title-row">

                    <span class="card-name">

                        ${c.name}

                    </span>


                    <span class="size-tag">

                        ${c.w}×${c.h}

                    </span>

                </div>


                <span
                    class="status-pill pending"
                >

                    ⏳ Aguardando revisão

                </span>


                <div class="obs-box">

                    <div class="obs-label">

                        Ajuste solicitado

                    </div>

                    <div class="obs-text"></div>

                </div>


                <div class="btn-row">

                    <button
                        class="btn btn-ok"
                        onclick="approve(${i})"
                    >

                        ✓ Aprovar

                    </button>


                    <button
                        class="btn btn-fix"
                        onclick="toggleFix(${i})"
                    >

                        ✎ Ajuste

                    </button>

                </div>


                <div
                    class="reject-form"
                    id="rf${i}"
                >

                    <textarea
                        placeholder="Descreva o ajuste necessário…"
                        rows="3"
                    ></textarea>


                    <button
                        class="btn-confirm"
                        onclick="confirmFix(${i})"
                    >

                        Confirmar solicitação

                    </button>

                </div>

            </div>

        </div>

        `;

    });


    root.appendChild(
        section
    );

});


summary();

</script>

</body>
</html>
